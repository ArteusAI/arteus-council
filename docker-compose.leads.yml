# Leads Mode Docker Compose Configuration
# Usage: docker compose -f docker-compose.leads.yml up --build

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${BACKEND_PORT:-8001}:${BACKEND_PORT:-8001}"
    environment:
      # API Keys
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS}
      - GIGACHAT_SCOPE=${GIGACHAT_SCOPE}
      - GIGACHAT_VERIFY_SSL=${GIGACHAT_VERIFY_SSL}
      - GIGACHAT_PARALLEL_DISABLED=${GIGACHAT_PARALLEL_DISABLED}
      - YANDEX_API_KEY=${YANDEX_API_KEY}
      - YANDEX_FOLDER_ID=${YANDEX_FOLDER_ID}
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
      # Server config
      - BACKEND_PORT=${BACKEND_PORT:-8001}
      - BASE_URL=${BASE_URL:-/}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://${BACKEND_HOST:-localhost}:${FRONTEND_PORT:-5173},http://localhost:${FRONTEND_PORT:-5173}}
      # Conference mode (maintenance screen)
      - END_CONFERENCE_MODE=${END_CONFERENCE_MODE:-false}
      # Hide Russian language option in the UI
      - DISABLE_RUSSIAN_LANGUAGE=${DISABLE_RUSSIAN_LANGUAGE:-true}
      # Leads mode configuration
      - LEADS_MODE=true
      - LEADS_MONGODB_URL=${LEADS_MONGODB_URL:-mongodb://167.235.102.202:27017}
      - LEADS_MONGODB_DB_NAME=${LEADS_MONGODB_DB_NAME:-council_leads}
      - LEADS_FIXED_IDENTITY_ID=${LEADS_FIXED_IDENTITY_ID:-product}
      - LEADS_PRODUCT_PROMPT=${LEADS_PRODUCT_PROMPT:-}
    # No data volume needed in leads mode - everything goes to MongoDB

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://${BACKEND_HOST:-localhost}:${BACKEND_PORT:-8001}}
        BASE_URL: ${BASE_URL:-${VITE_BASE_PATH:-/}}
        BACKEND_PORT: ${BACKEND_PORT:-8001}
        LEADS_DASHBOARD_BASE_PATH: ${LEADS_DASHBOARD_BASE_PATH:-/leads}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      - backend
      - leads-dashboard

  leads-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: ["uv", "run", "python", "backend/scripts/leads_dashboard.py", "--host", "0.0.0.0", "--port", "8090"]
    expose:
      - "8090"
    environment:
      - LEADS_MONGODB_URL=${LEADS_MONGODB_URL:-mongodb://167.235.102.202:27017}
      - LEADS_MONGODB_DB_NAME=${LEADS_MONGODB_DB_NAME:-council_leads}
      # Public path of the dashboard. Frontend nginx proxies this path to this service.
      - LEADS_DASHBOARD_BASE_PATH=${LEADS_DASHBOARD_BASE_PATH:-/leads}
      - LEADS_DASHBOARD_USERNAME=${LEADS_DASHBOARD_USERNAME:-admin}
      - LEADS_DASHBOARD_PASSWORD=${LEADS_DASHBOARD_PASSWORD:-arteus-leads}
      - LEADS_DASHBOARD_EXCLUDED_TELEGRAM=${LEADS_DASHBOARD_EXCLUDED_TELEGRAM:-}
